<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JK Monitor</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="shell">
    <header class="hero">
      <div>
        <p class="eyebrow">Local JK BMS monitoring</p>
        <h1>JK Monitor</h1>
        <p class="subtitle">Live health and device telemetry from the current backend endpoints.</p>
      </div>
      <div class="hero-status" id="service-status">
        <span class="pill">Connecting</span>
      </div>
    </header>

    <main class="grid">
      <section class="panel panel-wide setup-banner" id="setup-banner" hidden>
        <div>
          <p class="setup-kicker">First run</p>
          <h2 id="setup-title">Starting JK Monitor</h2>
          <p id="setup-copy">Preparing setup guidance.</p>
        </div>
        <div class="setup-actions">
          <span class="setup-chip" id="setup-mode-chip">Mode</span>
          <code class="setup-command" id="setup-command">~/jkmonitor/configure.sh</code>
        </div>
      </section>

      <section class="panel panel-wide">
        <div class="panel-header">
          <h2>Monitor Health</h2>
          <span id="last-refresh">Waiting for first refresh</span>
        </div>
        <div class="stats" id="health-stats"></div>
      </section>

      <section class="panel panel-wide">
        <div class="panel-header">
          <h2>Devices</h2>
          <span id="device-count">0 devices</span>
        </div>
        <div class="device-list" id="device-list"></div>
      </section>
    </main>
  </div>

  <template id="device-template">
    <article class="device-card">
      <div class="device-topline">
        <div>
          <h3 class="device-name"></h3>
          <p class="device-meta"></p>
        </div>
        <span class="device-outcome"></span>
      </div>
      <div class="device-metrics"></div>
      <div class="device-flags"></div>
      <p class="device-error"></p>
    </article>
  </template>

  <script src="/app.js" defer></script>
</body>
</html>
