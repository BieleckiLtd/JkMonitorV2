  publish-release:
    runs-on: ubuntu-latest
    needs:
      - resolve-release
      - publish-linux-arm64
      # - publish-windows-x64

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-assets
          merge-multiple: true

      - name: Create release notes
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
        run: |
          printf '%s\n' \
            'Install on a Linux ARM64 device directly from GitHub:' \
            '' \
            '```bash' \
            "wget -qO- https://raw.githubusercontent.com/BieleckiLtd/JkMonitorV2/dev/scripts/install-from-release.sh | bash -s -- https://github.com/BieleckiLtd/JkMonitorV2 $RELEASE_TAG" \
            '```' \
            '' \
            'Install on Windows x64 directly from GitHub:' \
            '' \
            '```powershell' \
            "powershell -ExecutionPolicy Bypass -Command \"& { \\$tmp = Join-Path \\$env:TEMP 'FluxMonitor-release-install.ps1'; Invoke-WebRequest 'https://raw.githubusercontent.com/BieleckiLtd/JkMonitorV2/dev/scripts/install-from-release.ps1' -OutFile \\$tmp; & powershell -ExecutionPolicy Bypass -File \\$tmp -Repository 'https://github.com/BieleckiLtd/JkMonitorV2' -ReleaseTag '$RELEASE_TAG' }\"" \
            '```' \
            '' \
            'Both installers download the published app artifact from GitHub Releases, install the ASP.NET Core runtime when needed, start in simulator mode for an immediate first run, and let the user finish RS485 setup from the browser UI.' \
            > release-notes.md

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
          RELEASE_TITLE: ${{ needs.resolve-release.outputs.title }}
          RELEASE_PRERELEASE: ${{ needs.resolve-release.outputs.prerelease }}
        shell: bash
        run: |
          mapfile -t assets < <(find release-assets -maxdepth 1 -type f | sort)

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TITLE" --notes-file release-notes.md
            exit 0
          fi

          if [[ "$RELEASE_PRERELEASE" == "true" ]]; then
            gh release create "$RELEASE_TAG" "${assets[@]}" --title "$RELEASE_TITLE" --notes-file release-notes.md --prerelease
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --title "$RELEASE_TITLE" --notes-file release-notes.md
          fi
