name: publish-backend

on:
  push:
    branches:
      - dev
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-backend-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: 10.0.x
  NODE_VERSION: 24.x
  PROJECT_PATH: src/FluxMonitor.Backend/FluxMonitor.Backend.csproj
  FRONTEND_PATH: src/FluxMonitor.UI
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  resolve-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      title: ${{ steps.release.outputs.title }}
      prerelease: ${{ steps.release.outputs.prerelease }}

    steps:
      - name: Resolve release channel
        id: release
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "title=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=dev-latest" >> "$GITHUB_OUTPUT"
            echo "title=dev-latest" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

  publish-linux-arm64:
    runs-on: ubuntu-latest
    needs: resolve-release

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.FRONTEND_PATH }}/package-lock.json

      - name: Restore
        run: dotnet restore ${{ env.PROJECT_PATH }} -p:TargetFramework=net10.0

      - name: Publish linux-arm64 backend
        shell: bash
        run: |
          BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          dotnet publish "${{ env.PROJECT_PATH }}" \
            --configuration Release \
            --runtime linux-arm64 \
            --self-contained false \
            -f net10.0 \
            -p:UseAppHost=false \
            -p:FluxMonitorReleaseTag="${{ needs.resolve-release.outputs.tag }}" \
            -p:FluxMonitorSourceRevisionId="${{ github.sha }}" \
            -p:FluxMonitorWorkflowRunNumber="${{ github.run_number }}" \
            -p:FluxMonitorWorkflowRunAttempt="${{ github.run_attempt }}" \
            -p:FluxMonitorBuiltAt="$BUILT_AT" \
            --output artifacts/linux-arm64

      - name: Package linux artifact
        shell: bash
        run: |
          tar -C artifacts -czf fluxmonitor-backend-linux-arm64.tar.gz linux-arm64
          sha256sum fluxmonitor-backend-linux-arm64.tar.gz > fluxmonitor-backend-linux-arm64.tar.gz.sha256

      - name: Upload linux workflow artifact
        uses: actions/upload-artifact@v5
        with:
          name: release-linux-arm64
          path: |
            fluxmonitor-backend-linux-arm64.tar.gz
            fluxmonitor-backend-linux-arm64.tar.gz.sha256

